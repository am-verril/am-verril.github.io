<article class="post-list">
	<time datetime="{{ .Date.Format "2006-01-02T15:04:05" }}">{{ if eq .Section "projects" }}{{ .Date.Format "2006" }}{{ else }}{{ .Date.Format "02 Jan 2006" }}{{ end }}</time>
	<h2 class="post-title"><a href="{{ with .Params.link }}{{ . }}{{ else }}{{ $.Permalink }}{{ end }}">{{ .Title }}</a></h2>
	{{ range .Params.tags }}
	<a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}">{{ . }}</a>
	{{ end }}
	<!-- <div>
		{{ .Summary }}
		{{ if .Truncated }}
			<a href="{{ .Permalink }}">Read more...</a>
		{{ end }}
	</div> -->
</article>
